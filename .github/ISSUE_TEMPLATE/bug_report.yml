name: Bug report
description: A pipeline step, model or analysis produced wrong results or failed
labels: [bug]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: [download, contracts, lakehouse, event stream, dbt models, orchestration, analytics, models, serving, experimentation, web app]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: The exact command, Python version and the commit of the data download.
      render: shell

name: Analysis or model request
description: Propose an analysis, model, metric or experiment
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: Business question
      description: The decision this would inform.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Data, method, baseline to beat and how the result will be validated.
    validations:
      required: true

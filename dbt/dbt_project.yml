name: commerce
version: "0.1.0"
config-version: 2
profile: commerce

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  commerce:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

flags:
  send_anonymous_usage_stats: false

version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
  - name: stg_order_items
    data_tests:
      - unique_combination:
          arguments:
            columns: [order_id, order_item_id]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
